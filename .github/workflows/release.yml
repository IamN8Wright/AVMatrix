name: Build and Release AV Matrix Studio

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify tag matches application version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          [xml]$project = Get-Content 'AVMatrixStudio.csproj'
          $appVersion = [string]$project.Project.PropertyGroup.Version
          $tagVersion = '${{ github.ref_name }}'.TrimStart('v', 'V')
          if ($appVersion -ne $tagVersion) {
            throw "Release tag ${{ github.ref_name }} does not match AVMatrixStudio.csproj version $appVersion."
          }

      - name: Build Windows release
        shell: pwsh
        run: |
          dotnet publish AVMatrixStudio.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output 'publish\win-x64' `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false

      - name: Verify release executable exists
        shell: pwsh
        run: |
          $exe = 'publish\win-x64\AVMatrixStudio.exe'
          if (-not (Test-Path $exe)) {
            throw "Expected release asset not found: $exe"
          }

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $exe = 'publish\win-x64\AVMatrixStudio.exe'
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  AVMatrixStudio.exe" | Set-Content -NoNewline 'publish\win-x64\AVMatrixStudio.exe.sha256'

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AVMatrixStudio-${{ github.ref_name }}
          path: |
            publish/win-x64/AVMatrixStudio.exe
            publish/win-x64/AVMatrixStudio.exe.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            'publish\win-x64\AVMatrixStudio.exe' `
            'publish\win-x64\AVMatrixStudio.exe.sha256' `
            --repo '${{ github.repository }}' `
            --title "AV Matrix Studio ${{ github.ref_name }}" `
            --generate-notes
