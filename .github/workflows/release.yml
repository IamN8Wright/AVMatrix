name: Build and Release AV Matrix Studio

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve application version
        id: app_version
        shell: pwsh
        run: |
          [xml]$project = Get-Content 'AVMatrixStudio.csproj'
          $version = [string]$project.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'AVMatrixStudio.csproj does not contain an application version.'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Verify tag matches application version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $appVersion = '${{ steps.app_version.outputs.version }}'
          $tagVersion = '${{ github.ref_name }}'.TrimStart('v', 'V')
          if ($appVersion -ne $tagVersion) {
            throw "Release tag ${{ github.ref_name }} does not match AVMatrixStudio.csproj version $appVersion."
          }

      - name: Restore production branding
        shell: pwsh
        run: .\Restore-BrandAssets.ps1

      - name: Build Windows release
        shell: pwsh
        run: |
          dotnet publish AVMatrixStudio.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output 'publish\win-x64' `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false

      - name: Verify release executable exists
        shell: pwsh
        run: |
          $exe = 'publish\win-x64\AVMatrixStudio.exe'
          if (-not (Test-Path $exe)) {
            throw "Expected release asset not found: $exe"
          }

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $exe = 'publish\win-x64\AVMatrixStudio.exe'
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  AVMatrixStudio.exe" | Set-Content -NoNewline 'publish\win-x64\AVMatrixStudio.exe.sha256'

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AVMatrixStudio-${{ steps.app_version.outputs.version }}-${{ github.run_number }}
          path: |
            publish/win-x64/AVMatrixStudio.exe
            publish/win-x64/AVMatrixStudio.exe.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release AV Matrix Studio '))
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ('${{ github.ref }}' -like 'refs/tags/v*') {
            '${{ github.ref_name }}'
          } else {
            '${{ steps.app_version.outputs.tag }}'
          }
          $exe = 'publish\win-x64\AVMatrixStudio.exe'
          $checksum = 'publish\win-x64\AVMatrixStudio.exe.sha256'
          gh release view $tag --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe $checksum --clobber --repo '${{ github.repository }}'
          } else {
            gh release create $tag $exe $checksum `
              --repo '${{ github.repository }}' `
              --target '${{ github.sha }}' `
              --title "AV Matrix Studio $tag" `
              --generate-notes
          }
