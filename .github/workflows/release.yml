name: Build InNasc for Windows

on:
  push:
    branches:
      - main
      - agent/innasc-major-update
      - agent/innasc-global-admin-split
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve application version
        id: app_version
        shell: pwsh
        run: |
          [xml]$project = Get-Content 'InNasc.csproj'
          $version = [string]$project.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'InNasc.csproj does not contain an application version.'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Verify tag matches application version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $appVersion = '${{ steps.app_version.outputs.version }}'
          $tagVersion = '${{ github.ref_name }}'.TrimStart('v', 'V')
          if ($appVersion -ne $tagVersion) {
            throw "Release tag ${{ github.ref_name }} does not match InNasc.csproj version $appVersion."
          }

      - name: Restore supplemental branding
        shell: pwsh
        run: .\Restore-BrandAssets.ps1

      - name: Run InNasc user application smoke tests
        shell: pwsh
        run: dotnet run --project tests\InNasc.SmokeTests\InNasc.SmokeTests.csproj --configuration Release

      - name: Run Global Admin publishing and migration smoke tests
        shell: pwsh
        run: dotnet run --project tests\InNasc.GlobalAdmin.SmokeTests\InNasc.GlobalAdmin.SmokeTests.csproj --configuration Release

      - name: Build Windows release
        shell: pwsh
        run: |
          dotnet publish InNasc.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output 'publish\win-x64' `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false

      - name: Build Global Admin Windows release
        shell: pwsh
        run: |
          dotnet publish InNasc.GlobalAdmin.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output 'publish\global-admin\win-x64' `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false

      - name: Verify InNasc executable
        shell: pwsh
        run: |
          $exe = 'publish\win-x64\InNasc.exe'
          if (-not (Test-Path $exe)) {
            throw "Expected release asset not found: $exe"
          }
          $product = (Get-Item $exe).VersionInfo.ProductName
          if ($product -ne 'InNasc') {
            throw "Unexpected executable product name: $product"
          }

      - name: Verify Global Admin executable
        shell: pwsh
        run: |
          $exe = 'publish\global-admin\win-x64\InNasc.GlobalAdmin.exe'
          if (-not (Test-Path $exe)) {
            throw "Expected Global Admin asset not found: $exe"
          }
          $product = (Get-Item $exe).VersionInfo.ProductName
          if ($product -ne 'InNasc Global Admin') {
            throw "Unexpected Global Admin product name: $product"
          }

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $exe = 'publish\win-x64\InNasc.exe'
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  InNasc.exe" | Set-Content -NoNewline 'publish\win-x64\InNasc.exe.sha256'
          $adminExe = 'publish\global-admin\win-x64\InNasc.GlobalAdmin.exe'
          $adminHash = (Get-FileHash $adminExe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$adminHash  InNasc.GlobalAdmin.exe" | Set-Content -NoNewline 'publish\global-admin\win-x64\InNasc.GlobalAdmin.exe.sha256'

      - name: Upload testable Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: InNasc-${{ steps.app_version.outputs.version }}-${{ github.run_number }}
          path: |
            publish/win-x64/InNasc.exe
            publish/win-x64/InNasc.exe.sha256
            publish/global-admin/win-x64/InNasc.GlobalAdmin.exe
            publish/global-admin/win-x64/InNasc.GlobalAdmin.exe.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release InNasc '))
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ('${{ github.ref }}' -like 'refs/tags/v*') {
            '${{ github.ref_name }}'
          } else {
            '${{ steps.app_version.outputs.tag }}'
          }
          $exe = 'publish\win-x64\InNasc.exe'
          $checksum = 'publish\win-x64\InNasc.exe.sha256'
          $adminExe = 'publish\global-admin\win-x64\InNasc.GlobalAdmin.exe'
          $adminChecksum = 'publish\global-admin\win-x64\InNasc.GlobalAdmin.exe.sha256'
          gh release view $tag --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe $checksum $adminExe $adminChecksum --clobber --repo '${{ github.repository }}'
          } else {
            gh release create $tag $exe $checksum $adminExe $adminChecksum `
              --repo '${{ github.repository }}' `
              --target '${{ github.sha }}' `
              --title "InNasc $tag" `
              --generate-notes
          }
