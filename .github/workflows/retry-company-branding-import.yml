name: Retry company branding and import patch

on:
  push:
    branches:
      - agent/innasc-company-tiers

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: startsWith(github.event.head_commit.message, 'Retry company branding patch')
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: agent/innasc-company-tiers
          fetch-depth: 0

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore supplemental branding
        shell: pwsh
        run: .\Restore-BrandAssets.ps1

      - name: Reuse source patch from bootstrap workflow
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          source = Path('.github/workflows/apply-company-branding-import.yml')
          text = source.read_text(encoding='utf-8')

          def extract_step(name: str, destination: str):
              marker = f"      - name: {name}\n"
              start = text.index(marker)
              run_marker = "        run: |\n"
              run_start = text.index(run_marker, start) + len(run_marker)
              next_step = text.find("\n      - name: ", run_start)
              if next_step < 0:
                  next_step = len(text)
              block = text[run_start:next_step]
              lines = []
              for line in block.splitlines():
                  if line.startswith("          "):
                      lines.append(line[10:])
                  else:
                      lines.append(line)
              Path(destination).write_text("\n".join(lines) + "\n", encoding='utf-8')

          extract_step('Add company metadata services', '.company-metadata.ps1')
          extract_step('Patch existing source', '.company-patch.ps1')
          '@ | Set-Content -Encoding UTF8 .extract-company-patch.py
          python .extract-company-patch.py
          pwsh -NoProfile -File .company-metadata.ps1
          pwsh -NoProfile -File .company-patch.ps1
          Remove-Item .extract-company-patch.py,.company-metadata.ps1,.company-patch.ps1 -ErrorAction SilentlyContinue

      - name: Set release version 5.2.2
        shell: pwsh
        run: |
          foreach ($project in @('InNasc.csproj', 'InNasc.GlobalAdmin.csproj')) {
            $content = Get-Content $project -Raw
            if ($content -notmatch '<Version>5\.2\.1</Version>') {
              throw "$project does not contain expected version 5.2.1."
            }
            $content = $content.Replace('<Version>5.2.1</Version>', '<Version>5.2.2</Version>')
            Set-Content -Encoding UTF8 $project $content
          }

      - name: Run Global Admin smoke tests
        shell: pwsh
        run: dotnet run --project tests\InNasc.GlobalAdmin.SmokeTests\InNasc.GlobalAdmin.SmokeTests.csproj --configuration Release

      - name: Run user app smoke tests
        shell: pwsh
        run: dotnet run --project tests\InNasc.SmokeTests\InNasc.SmokeTests.csproj --configuration Release

      - name: Build both Windows applications
        shell: pwsh
        run: |
          dotnet build InNasc.csproj --configuration Release
          dotnet build InNasc.GlobalAdmin.csproj --configuration Release

      - name: Commit tested feature
        shell: pwsh
        run: |
          Remove-Item .github\workflows\retry-company-branding-import.yml -ErrorAction SilentlyContinue
          git config user.name "IamN8Wright"
          git config user.email "iamn8wright@gmail.com"
          git add -A
          git commit -m "Add Global Admin company import and branding"
          git push origin HEAD:agent/innasc-company-tiers
