name: InNasc inventory QC
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Inventory, import and synchronization regressions
        run: dotnet run --project tests/InNasc.CoreTests/InNasc.CoreTests.csproj --configuration Release
