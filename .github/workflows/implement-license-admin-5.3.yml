          # Global Admin GitHub updater, same verification/install strategy as main app but separate asset/product.
          write('GlobalAdminUpdateService.cs', r'''using System.Diagnostics;
using System.Net;
using System.Security.Cryptography;
using System.Text;
using System.Text.Json;

namespace InNasc;

internal static class GlobalAdminUpdateService
{
    private const string Api = "https://api.github.com/repos/IamN8Wright/AVMatrix/releases/latest";
    private const string ExeAsset = "InNasc.GlobalAdmin.exe";
    private const string HashAsset = "InNasc.GlobalAdmin.exe.sha256";

    public static async Task CheckAndPromptAsync(Form owner, bool silentWhenCurrent)
    {
        try
        {
            using var http = Client();
            using var response = await http.GetAsync(Api);
            response.EnsureSuccessStatusCode();
            using var doc = JsonDocument.Parse(await response.Content.ReadAsStringAsync());
            var root = doc.RootElement;
            var tag = root.GetProperty("tag_name").GetString() ?? "";
            if (!Version.TryParse(tag.TrimStart('v','V'), out var latest)) throw new InvalidDataException("The GitHub release version is unreadable.");
            var current = Version.TryParse(AppInfo.Revision, out var parsed) ? parsed : new Version();
            if (latest <= current)
            {
                if (!silentWhenCurrent) MessageBox.Show(owner, $"InNasc Global Admin {AppInfo.Revision} is current.", "Check for updates", MessageBoxButtons.OK, MessageBoxIcon.Information);
                return;
            }
            if (MessageBox.Show(owner, $"InNasc Global Admin {latest} is available.\r\n\r\nDownload, verify, and install it now?", "Global Admin update", MessageBoxButtons.YesNo, MessageBoxIcon.Information) != DialogResult.Yes) return;
            var assets = root.GetProperty("assets").EnumerateArray().ToList();
            string Url(string name) => assets.First(a => string.Equals(a.GetProperty("name").GetString(), name, StringComparison.OrdinalIgnoreCase)).GetProperty("browser_download_url").GetString()!;
            var dir = Path.Combine(Path.GetTempPath(), "InNasc", "GlobalAdminUpdates", Guid.NewGuid().ToString("N")); Directory.CreateDirectory(dir);
            var exe = Path.Combine(dir, ExeAsset);
            var expectedText = await http.GetStringAsync(Url(HashAsset));
            var expected = expectedText.Split([' ','\t','\r','\n'], StringSplitOptions.RemoveEmptyEntries).First();
            await File.WriteAllBytesAsync(exe, await http.GetByteArrayAsync(Url(ExeAsset)));
            var actual = Convert.ToHexString(await SHA256.HashDataAsync(File.OpenRead(exe)));
            if (!string.Equals(actual, expected, StringComparison.OrdinalIgnoreCase)) throw new InvalidDataException("The Global Admin update failed SHA-256 verification.");
            var vi = FileVersionInfo.GetVersionInfo(exe);
            if (!string.Equals(vi.ProductName, "InNasc Global Admin", StringComparison.OrdinalIgnoreCase)) throw new InvalidDataException("The downloaded executable is not InNasc Global Admin.");
            if (!Version.TryParse(vi.ProductVersion?.Split('+')[0], out var exeVersion) || exeVersion != latest) throw new InvalidDataException("The downloaded Global Admin version does not match the GitHub release.");
            Install(exe, dir);
        }
        catch (Exception exception)
        {
            if (!silentWhenCurrent) MessageBox.Show(owner, $"The Global Admin update could not be completed.\r\n\r\n{exception.Message}", "Global Admin update", MessageBoxButtons.OK, MessageBoxIcon.Error);
        }
    }

    private static HttpClient Client()
    {
        var http = new HttpClient(new HttpClientHandler { AllowAutoRedirect = true, AutomaticDecompression = DecompressionMethods.All }) { Timeout = TimeSpan.FromMinutes(15) };
        http.DefaultRequestHeaders.UserAgent.ParseAdd($"InNasc-GlobalAdmin/{AppInfo.Revision}");
        http.DefaultRequestHeaders.Accept.ParseAdd("application/vnd.github+json"); return http;
    }

    private static void Install(string source, string staging)
    {
        var target = Environment.ProcessPath;
        if (string.IsNullOrWhiteSpace(target) || !target.EndsWith(".exe", StringComparison.OrdinalIgnoreCase)) throw new InvalidOperationException("Automatic installation requires the packaged Global Admin executable.");
        var script = "$ErrorActionPreference='Stop'\r\n" +
            $"$pidToWait={Environment.ProcessId}\r\n$source='{Lit(source)}'\r\n$target='{Lit(target)}'\r\n$staging='{Lit(staging)}'\r\n" +
            "Wait-Process -Id $pidToWait -ErrorAction SilentlyContinue\r\nStart-Sleep -Milliseconds 400\r\nCopy-Item -LiteralPath $source -Destination $target -Force\r\nStart-Process -FilePath $target\r\nStart-Sleep -Milliseconds 400\r\nRemove-Item -LiteralPath $staging -Recurse -Force -ErrorAction SilentlyContinue\r\n";
        Process.Start(new ProcessStartInfo { FileName="powershell.exe", Arguments=$"-NoProfile -NonInteractive -ExecutionPolicy Bypass -EncodedCommand {Convert.ToBase64String(Encoding.Unicode.GetBytes(script))}", UseShellExecute=false, CreateNoWindow=true });
        Application.Exit();
    }
    private static string Lit(string value) => value.Replace("'", "''");
}
