name: Implement InNasc 5.3 license admin

on:
  push:
    branches:
      - agent/innasc-license-admin-5.3

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore supplemental branding
        shell: pwsh
        run: .\Restore-BrandAssets.ps1

      - name: Apply core changes
        shell: pwsh
        run: python tools\patch53_core.py

      - name: Apply UI changes
        shell: pwsh
        run: python tools\patch53_ui.py

      - name: Apply validation changes
        shell: pwsh
        run: python tools\patch53_tests.py

      - name: Run user application smoke tests
        shell: pwsh
        run: dotnet run --project tests\InNasc.SmokeTests\InNasc.SmokeTests.csproj --configuration Release

      - name: Run Global Admin smoke tests
        shell: pwsh
        run: dotnet run --project tests\InNasc.GlobalAdmin.SmokeTests\InNasc.GlobalAdmin.SmokeTests.csproj --configuration Release

      - name: Build both Windows applications
        shell: pwsh
        run: |
          dotnet build InNasc.csproj --configuration Release
          dotnet build InNasc.GlobalAdmin.csproj --configuration Release

      - name: Commit tested release
        shell: pwsh
        run: |
          git config user.name "IamN8Wright"
          git config user.email "iamn8wright@gmail.com"
          Remove-Item tools\patch53_core.py
          Remove-Item tools\patch53_ui.py
          Remove-Item tools\patch53_tests.py
          Remove-Item .github\workflows\implement-license-admin-5.3.yml
          git add -A
          git commit -m "Add license lifecycle and Global Admin recovery tools"
          git push origin HEAD:agent/innasc-license-admin-5.3
