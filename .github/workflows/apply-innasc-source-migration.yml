name: Apply InNasc source migration

on:
  push:
    branches:
      - agent/innasc-major-update
    paths:
      - 'tools/apply-innasc-source-migration.ps1'

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: agent/innasc-major-update
          fetch-depth: 0

      - name: Apply targeted source migration
        shell: pwsh
        run: .\tools\apply-innasc-source-migration.ps1

      - name: Commit generated source changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if (git diff --cached --quiet) {
            Write-Host 'No generated source changes remain.'
            exit 0
          }
          git commit -m "Apply InNasc source migration"
          git push origin HEAD:agent/innasc-major-update
